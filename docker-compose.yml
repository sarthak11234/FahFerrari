version: '3.8'

services:
  fahferrari:
    build:
      context: ./ferrari-f1-predictor
      dockerfile: Dockerfile
    container_name: fahferrari_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      # - GEMINI_API_KEY=${GEMINI_API_KEY} # Optional: For AI Strategist chat

